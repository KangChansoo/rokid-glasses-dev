name: Android checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check.py
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: chmod +x native/gradlew
      - run: native/gradlew -p native --no-daemon :gpt-viewer:assembleDebug :paper-viewer:assembleDebug :paper-viewer:testDebugUnitTest :gpt-viewer:lintDebug :paper-viewer:lintDebug :adb-helper:assembleDebug :adb-helper:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: |
            native/gpt-viewer/build/outputs/apk/debug/*.apk
            native/paper-viewer/build/outputs/apk/debug/*.apk
            native/adb-helper/build/outputs/apk/debug/*.apk
