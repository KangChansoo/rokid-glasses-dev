plugins { id 'com.android.application' }
android {
    namespace 'dev.rokidapps.paperviewer'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'dev.rokidapps.paperviewer'
        minSdk 31; targetSdk 36
        versionCode 1; versionName '0.2.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation project(':android-ui'); testImplementation 'junit:junit:4.13.2' }
